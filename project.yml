name: PitterPattern

options:
  bundleIdPrefix: com.pitterpattern
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  PitterCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.1"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  PitterPattern:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PitterCore
    info:
      path: App/iOS-Info.plist
      properties:
        CFBundleDisplayName: Pitter Patterns
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  PitterPatternMac:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: PitterCore
    info:
      path: App/macOS-Info.plist
      properties:
        CFBundleDisplayName: Pitter Patterns
        LSApplicationCategoryType: public.app-category.music
